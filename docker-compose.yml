services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: addy_rw
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: humble_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U addy_rw -d humble_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
